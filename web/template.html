<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <meta name="description" content="Jack Coleman - Staff Platform Engineer in FinTech, NYC">
    <meta name="author" content="Jack Coleman">
</head>
<body>
    <div class="container">
        <header>
            <h1>Jack Coleman</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem; margin-top: var(--space-md);">
                Staff Platform Engineer in FinTech | 📍 NYC
            </p>
        </header>
        
        <main>
            <article>
                {{ .Content }}
            </article>
        </main>
        
        <footer>
            <p>Built with Go, HTMX, and Markdown</p>
            <p>&copy; 2025 Jack Coleman</p>
        </footer>
    </div>

    <script>
        // Add smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Add language labels to code blocks
        document.querySelectorAll('pre code').forEach(block => {
            const language = block.className.match(/language-(\w+)/);
            if (language) {
                block.parentElement.setAttribute('data-lang', language[1]);
            }
        });

        // Add copy button to code blocks
        document.querySelectorAll('pre').forEach(pre => {
            const copyButton = document.createElement('button');
            copyButton.innerHTML = '📋';
            copyButton.style.cssText = `
                position: absolute;
                top: var(--space-sm);
                left: var(--space-md);
                background: var(--background-tertiary);
                border: 1px solid var(--border-color);
                color: var(--text-muted);
                padding: var(--space-xs) var(--space-sm);
                border-radius: var(--radius-sm);
                cursor: pointer;
                font-size: 0.75rem;
                opacity: 0.7;
                transition: opacity 0.2s ease;
            `;
            
            copyButton.addEventListener('click', async () => {
                const code = pre.querySelector('code').textContent;
                await navigator.clipboard.writeText(code);
                copyButton.innerHTML = '✓';
                setTimeout(() => {
                    copyButton.innerHTML = '📋';
                }, 2000);
            });
            
            copyButton.addEventListener('mouseenter', () => {
                copyButton.style.opacity = '1';
            });
            
            copyButton.addEventListener('mouseleave', () => {
                copyButton.style.opacity = '0.7';
            });
            
            pre.style.position = 'relative';
            pre.appendChild(copyButton);
        });
    </script>
</body>
</html>
