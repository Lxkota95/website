<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Prism.js for syntax highlighting - fixed order -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <!-- Load common languages first -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-rust.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <!-- Then load autoloader for other languages -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <meta name="description" content="Jack Coleman - Staff Platform Engineer in FinTech, NYC">
    <meta name="author" content="Jack Coleman">
</head>
<body>
    <div class="container">
        <header>
            <h1>Jack Coleman</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem; margin-top: var(--space-md);">
                Staff Platform Engineer in FinTech | 📍 NYC
            </p>
        </header>
        
        <main>
            <article>
                {{ .Content }}
            </article>
        </main>
        
        <footer>
            <p>Built with Go, HTMX, and Markdown</p>
            <p>&copy; 2025 Jack Coleman</p>
        </footer>
    </div>

    <script>
        // Add smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });

        // Add language labels to code blocks
        document.querySelectorAll('pre code').forEach(block => {
            const language = block.className.match(/language-(\w+)/);
            if (language) {
                block.parentElement.setAttribute('data-lang', language[1]);
            }
        });

        // Add copy button to code blocks with proper styling
        document.querySelectorAll('pre').forEach(pre => {
            const copyButton = document.createElement('button');
            copyButton.innerHTML = '📋';
            copyButton.className = 'copy-button';
            
            copyButton.addEventListener('click', async () => {
                const code = pre.querySelector('code').textContent;
                try {
                    await navigator.clipboard.writeText(code);
                    copyButton.innerHTML = '✓';
                    setTimeout(() => {
                        copyButton.innerHTML = '📋';
                    }, 2000);
                } catch (err) {
                    // Fallback for older browsers
                    console.log('Copy failed:', err);
                }
            });
            
            pre.style.position = 'relative';
            pre.appendChild(copyButton);
        });

        // Initialize Prism.js after DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Prism !== 'undefined') {
                Prism.highlightAll();
            }
        });
    </script>
</body>
</html>
