name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Build the site
        run: go run ./cmd/site build -out public
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          include-hidden-files: true
